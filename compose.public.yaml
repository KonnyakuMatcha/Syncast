services:
  syncast:
    build: .
    restart: unless-stopped
    environment:
      RTC_STUN_URLS: stun:${SYNCAST_DOMAIN}:3478
      RTC_TURN_URLS: turn:${SYNCAST_DOMAIN}:3478?transport=udp,turn:${SYNCAST_DOMAIN}:3478?transport=tcp
      RTC_TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in .env}
      RTC_TURN_TTL: 3600
    networks:
      - syncast

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      syncast:
        condition: service_healthy
    environment:
      SYNCAST_DOMAIN: ${SYNCAST_DOMAIN:?Set SYNCAST_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - syncast

  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    command:
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Set TURN_SECRET in .env}
      - --realm=${SYNCAST_DOMAIN:?Set SYNCAST_DOMAIN in .env}
      - --external-ip=${PUBLIC_IP:?Set PUBLIC_IP in .env}
      - --listening-ip=0.0.0.0
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --stale-nonce=600
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - syncast

networks:
  syncast:

volumes:
  caddy_data:
  caddy_config:
