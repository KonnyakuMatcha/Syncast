services:
  syncast:
    build: .
    restart: unless-stopped
    environment:
      RTC_STUN_URLS: ${RTC_STUN_URLS:-stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302}
    networks:
      - syncast

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      syncast:
        condition: service_healthy
    environment:
      SYNCAST_DOMAIN: ${SYNCAST_DOMAIN:?Set SYNCAST_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - syncast

networks:
  syncast:

volumes:
  caddy_data:
  caddy_config:
